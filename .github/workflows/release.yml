name: "Publish release to PyPI"

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      # Optional, but recommended: run smoke tests on distributions
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish

    
  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          cat > release-notes.md <<EOF
          ## Quick Installation

          Requires Python 3.12+ and either uv or pipx.

          ### Option A: uv (Recommended)

          ~~~bash
          uv tool install "ai-data-summarizer==$VERSION"
          sumdata
          ~~~

          ### Option B: pipx

          ~~~bash
          pipx install "ai-data-summarizer==$VERSION"
          sumdata
          ~~~

          ## Configuration

          For AI-powered summaries, provide your API
          key when prompted.

          See the [Installation Guide](https://github.com/$GH_REPO/blob/$TAG/INSTALL.md)
          and [Configuration Guide](https://github.com/$GH_REPO/blob/$TAG/CONFIGURATION.md)
          for additional instructions.
          EOF

          flags=()
          if [[ "$VERSION" =~ (rc|a|b)[0-9]+$ ]]; then
            flags+=(--prerelease --latest=false)
          fi

          gh release create "$TAG" dist/* \
            --title "AI Data Summarizer $TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"

